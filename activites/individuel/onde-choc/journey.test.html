<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Test parcours Onde de choc</title></head>
<body>
  <pre id="results">Test en cours…</pre>
  <iframe id="activity-frame" style="width:500px;height:700px;border:0"></iframe>
  <script>
    const frame = document.querySelector("#activity-frame");
    const output = document.querySelector("#results");
    const passed = [];
    const wait = (delay = 100) => new Promise((resolve) => setTimeout(resolve, delay));
    const test = (name, condition) => {
      if (!condition) throw new Error(name);
      passed.push("✓ " + name);
    };
    frame.addEventListener("load", async () => {
      try {
        const page = frame.contentDocument;
        const view = frame.contentWindow;
        await wait(180);
        test("quatre histoires proposées", page.querySelectorAll(".story-choice").length === 4);
        page.querySelector(".story-choice").click();
        await wait();
        test("introduction de l’histoire affichée", !page.querySelector("#intro").hidden);
        test("bulle vide supprimée", !page.querySelector("#story-context"));
        test("bouton pour changer d’histoire présent", Boolean(page.querySelector("#change-story")));
        page.querySelector("#change-story").click();
        await wait();
        test("retour au choix des histoires", !page.querySelector("#selection").hidden);
        page.querySelector(".story-choice").click();
        await wait();
        page.querySelector("#discover").click();
        for (let step = 1; step <= 4; step += 1) {
          await wait();
          test("étape " + step + " affichée", page.querySelector("#step-label").textContent.includes("Étape " + step + " sur 4"));
          page.querySelector('#step-content input').checked = true;
          page.querySelector("#step-form").requestSubmit();
          await wait(520);
        }
        test("parcours terminé", !page.querySelector("#completed").hidden);
        page.querySelector("#results-button").click();
        await wait(150);
        test("quatre niveaux corrigés", page.querySelectorAll(".result-level").length === 4);
        test("responsabilité objective expliquée", page.querySelector(".rule-note").textContent.includes("Responsabilité objective"));
        test("message final présent", page.querySelector("#final-message").textContent.length > 200);
        test("aucune donnée manquante affichée", !page.querySelector("#results").textContent.includes("undefined"));
        test("bilan cadré dans la zone de jeu", view.scrollY > 0);
        page.querySelector("#take-home-button").click();
        await wait(150);
        test("page take-home affichée après le bilan", !page.querySelector("#take-home").hidden);
        test("quatre niveaux de conséquences rappelés", page.querySelectorAll(".consequence-chain article").length === 4);
        test("caractère non automatique rappelé", page.querySelector(".not-automatic").textContent.includes("n’est pas automatique"));
        test("trois réflexes de prévention présents", page.querySelectorAll(".prevent-wave li").length === 3);
        test("take-home cadré dans la zone de jeu", view.scrollY > 0);
        output.textContent = passed.join("\n") + "\n\n" + passed.length + " tests réussis";
      } catch (error) {
        output.textContent = "ÉCHEC : " + error.message;
      }
    });
    frame.src = "index.html";
  </script>
</body>
</html>
