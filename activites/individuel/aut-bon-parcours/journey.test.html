<!doctype html><meta charset="utf-8"><title>Test parcours AUT</title><pre id="result"></pre><script>fetch('index.html').then(r=>r.text()).then(html=>{const ids=['intro','chapter-one','definition','crossroad','levels','dossier','committee','criteria','granted','emergency','timeline','retro-info','final'];const checks=ids.map(id=>[id,html.includes(`id="${id}"`)]);document.querySelector('#result').textContent=checks.map(([n,ok])=>`${ok?'✓':'✗'} écran ${n}`).join('\n');if(checks.some(x=>!x[1]))throw Error('Écran manquant')});</script>
