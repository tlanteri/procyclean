<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Réalisez les activités PRO-CYCLEAN en autonomie, sans session ni connexion.">
  <title>Mode individuel — PRO-CYCLEAN</title>
  <link rel="icon" type="image/png"
    href="../../assets/images/logo-procyclean.png">
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="stylesheet" href="../../assets/navigation.css?v=28">
</head>
<body>
  <header class="institutional-header">
    <img class="logo-ffc" src="../../assets/images/logo-ffc.png"
      alt="Fédération Française de Cyclisme"><img class="logo-uca" src="../../assets/images/Logo_UCA.png" alt="Université Côte d&#8217;Azur">
    <div class="partner-logos">
      <img class="logo-procyclean"
        src="../../assets/images/logo-procyclean.png" alt="PRO-CYCLEAN">
      <img class="logo-lamhess"
        src="../../assets/images/logo-lamhess-blanc.png"
        alt="Laboratoire LAMHESS">
    </div>
  </header>

  <main class="solo-app">
    <section id="activity-selection" class="selection-screen">
      <a class="selection-back-button" href="../index.html">
        ← Retour au choix du mode
      </a>
      <p class="eyebrow">Mode individuel</p>
      <h1>Choisis ton activité</h1>
      <p class="intro">
        Avance à ton rythme. Les corrections et les explications apparaissent
        directement, sans code de session et sans éducateur.
      </p>

      <div class="activity-grid">
        <button class="activity-card" type="button" data-activity="podium">
          <span class="activity-icon" aria-hidden="true">🏆</span>
          <strong>Le podium des valeurs</strong>
          <span>Classe les valeurs qui guident ta pratique sportive.</span>
        </button>
        <button class="activity-card" type="button" data-activity="vrai-faux">
          <span class="activity-icon" aria-hidden="true">⚡</span>
          <strong>Les bases du sport propre – Vrai/Faux express</strong>
          <span>Découvre le sport propre, l’AFLD, l’AMA et les sources fiables.</span>
        </button>
        <button class="activity-card" type="button" data-activity="mission">
          <span class="activity-icon" aria-hidden="true">🔎</span>
          <strong>La mission contrôle</strong>
          <span>Replace les étapes d’un contrôle antidopage dans l’ordre.</span>
        </button>
        <button class="activity-card" type="button" data-activity="produit">
          <span class="activity-icon" aria-hidden="true">🔍</span>
          <strong>Le produit mystère</strong>
          <span>Analyse les indices avant de prendre une décision.</span>
        </button>
        <button class="activity-card" type="button" data-activity="traitement">
          <span class="activity-icon" aria-hidden="true">🩺</span>
          <strong>Médicament : les bons réflexes</strong>
          <span>Choisis la conduite sûre dans des situations concrètes.</span>
        </button>
        <button class="activity-card" type="button" data-activity="responsabilite">
          <span class="activity-icon" aria-hidden="true">🧭</span>
          <strong>À sa place, serais-tu vigilant ?</strong>
          <span>Analyse six situations, repère les influences et comprends ta responsabilité.</span>
        </button>
        <button class="activity-card" type="button" data-activity="droits-controle">
          <span class="activity-icon" aria-hidden="true">✓</span>
          <strong>Mes droits pendant un contrôle</strong>
          <span>Vis un contrôle complet et construis ta fiche de droits et de responsabilités.</span>
        </button>
        <button class="activity-card" type="button" data-activity="labo-interdictions">
          <span class="activity-icon" aria-hidden="true">⌕</span>
          <strong>La liste des substances et méthodes interdites</strong>
          <span>Teste tes idées en 6 questions avant d’apprendre à vérifier.</span>
        </button>
        <button class="activity-card" type="button" data-activity="vrad-sanctions">
          <span class="activity-icon" aria-hidden="true">§</span>
          <strong>Les violations des règles antidopage et les sanctions</strong>
          <span>Découvre les 11 VRAD et complète ton Code du sport propre.</span>
        </button>
        <button class="activity-card" type="button" data-activity="aut-bon-parcours">
          <span class="activity-icon" aria-hidden="true">+</span>
          <strong>AUT : avant ou après ?</strong>
          <span>Comprends ce qu’est une AUT, quand la demander et les quatre critères examinés.</span>
        </button>
        <button class="activity-card" type="button" data-activity="onde-choc">
          <span class="activity-icon" aria-hidden="true">🌊</span>
          <strong>Les conséquences du dopage</strong>
          <span>Identifie les conséquences possibles sur la santé, la vie sportive et la vie sociale ou professionnelle.</span>
        </button>
        <button class="activity-card" type="button" data-activity="briser-silence">
          <span class="activity-icon" aria-hidden="true">💬</span>
          <strong>Messages sous pression</strong>
          <span>Lis les messages, repère les signaux d’alerte et aide les sportifs à trouver la bonne personne.</span>
        </button>
        <button class="activity-card" type="button" data-activity="mission-localisation">
          <span class="activity-icon" aria-hidden="true">📅</span>
          <strong>Mission localisation</strong>
          <span>Aide trois sportifs à comprendre leur groupe, compléter leur agenda et mettre leurs informations à jour.</span>
        </button>
      </div>
    </section>

    <section id="activity-runner" class="runner-screen" hidden>
      <div class="runner-toolbar">
        <button id="back-to-selection" class="secondary-button" type="button">
          ← Toutes les activités
        </button>
        <span class="offline-badge">Sans connexion Firebase</span>
      </div>
      <div id="activity-content" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/navigation.js?v=27"
    data-root="../../" data-section="activities"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
