<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Tests conséquences</title></head><body><pre id="r"></pre><script type="module">import{CONSEQUENCES,CATEGORIES,FALSE_IDEAS,FINAL_MESSAGE}from"./content.js";const r=[],t=(n,v)=>{if(!v)throw Error(n);r.push("✓ "+n)};t("16 propositions",CONSEQUENCES.length===16);t("12 conséquences",CONSEQUENCES.filter(x=>x.category).length===12);t("4 idées fausses",CONSEQUENCES.filter(x=>!x.category).length===4);t("3 catégories",CATEGORIES.length===3);t("4 conséquences par catégorie",CATEGORIES.every(c=>CONSEQUENCES.filter(x=>x.category===c.id).length===4));t("correction présente",FALSE_IDEAS.length>100);t("message final présent",FINAL_MESSAGE.length>150);document.querySelector("#r").textContent=r.join("\n")</script></body></html>
