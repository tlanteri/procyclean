<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Tests — droits contrôle</title></head><body><pre id="result"></pre><script type="module">import{MOMENTS,PHASES,RIGHTS,RESPONSIBILITIES}from"./situations.js";const tests=[];function test(name,condition){tests.push({name,condition})}test("9 moments clés",MOMENTS.length===9);test("identifiants uniques",new Set(MOMENTS.map(x=>x.id)).size===MOMENTS.length);test("réponses valides",MOMENTS.every(x=>Number.isInteger(x.correct)&&x.choices[x.correct]));test("feedbacks et réflexes",MOMENTS.every(x=>x.feedback&&x.reflex));test("phases couvertes",PHASES.every(p=>MOMENTS.some(x=>x.phase===p)));test("droits et responsabilités",RIGHTS.length>0&&RESPONSIBILITIES.length>0);const failed=tests.filter(x=>!x.condition);document.querySelector("#result").textContent=tests.map(x=>`${x.condition?"✓":"✗"} ${x.name}`).join("\n")+`\n\n${failed.length?`${failed.length} échec(s)`:"Tous les tests sont réussis."}`;if(failed.length)throw new Error("Tests échoués");</script></body></html>
