<!doctype html><meta charset="utf-8"><title>Test contenu AUT</title><pre id="result"></pre><script type="module">import{REGULATORY_META,CROSSROAD,DOSSIER_CARDS,CRITERIA,TIMELINE}from"./aut-data.js";const checks=[['source AFLD',REGULATORY_META.primarySource.includes('afld.fr')],['révision datée',!!REGULATORY_META.lastChecked],['4 situations carrefour',CROSSROAD.length===4],['dossier avec éléments utiles',DOSSIER_CARDS.some(x=>x.useful)],['dossier avec distracteurs',DOSSIER_CARDS.some(x=>!x.useful)],['4 critères',CRITERIA.length===4],['6 étapes rétroactives',TIMELINE.length===6]];document.querySelector('#result').textContent=checks.map(([n,ok])=>`${ok?'✓':'✗'} ${n}`).join('\n');if(checks.some(x=>!x[1]))throw Error('Test AUT échoué');</script>
