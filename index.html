
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil — PRO-CYCLEAN</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/navigation.css?v=1">
</head>
<body>
  <header class="institutional-header">
    <img
      class="logo-ffc"
      src="assets/images/logo-ffc.png"
      alt="Fédération Française de Cyclisme"
    >
    <div class="partner-logos">
      <img
        class="logo-procyclean"
        src="assets/images/logo-procyclean.png"
        alt="PRO-CYCLEAN"
      >
      <img
        class="logo-lamhess"
        src="assets/images/logo-lamhess-blanc.png"
        alt="Laboratoire LAMHESS"
      >
    </div>
  </header>

  <main class="portal">
    <p class="eyebrow">PRO-CYCLEAN</p>
    <h1>Bienvenue</h1>
    <p class="intro">
      Ouvrez le menu pour accéder aux activités et aux ressources
      pédagogiques.
    </p>
    <button id="home-menu-button" class="portal-button" type="button">
      Ouvrir le menu
    </button>
  </main>

  <script
    src="assets/navigation.js?v=1"
    data-root="./"
    data-section="home"
  ></script>
  <script>
    document.querySelector("#home-menu-button").addEventListener("click", () => {
      document.querySelector(".global-menu-button").click();
    });
  </script>
</body>
</html>
