<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livret Santé & Performance</title><link rel="stylesheet" href="style.css?v=1"><link rel="stylesheet" href="page-turn-v2.css?v=1"></head><body>
<main class="reader"><header class="reader-bar"><div><strong>Livret Santé &amp; Performance</strong><span id="page-status">Chargement…</span></div><div class="reader-actions"><button id="zoom-out" type="button" aria-label="Réduire">−</button><button id="zoom-in" type="button" aria-label="Agrandir">+</button><button id="fullscreen" type="button">Plein écran</button></div></header>
<section id="book" class="book" aria-live="polite"><div id="loading" class="loading">Préparation du livret…</div><div id="page-left" class="paper" hidden><canvas></canvas></div><div id="page-right" class="paper" hidden><canvas></canvas></div></section>
<nav class="controls" aria-label="Navigation dans le livret"><button id="previous" type="button">← Page précédente</button><label>Page <input id="page-input" type="number" min="1" value="1"> <span id="page-total"></span></label><button id="next" type="button">Page suivante →</button></nav><p id="error" class="error" hidden></p>
</main><script type="module" src="script.js?v=3"></script><script src="navigation.js?v=1"></script></body></html>
